name: Deploy to 2 EC2 Servers using Git Pull

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Create PEM key files
        run: |
          echo "${{ secrets.EC2_PEM_KEY_1 }}" > key1.pem
          echo "${{ secrets.EC2_PEM_KEY_2 }}" > key2.pem
          chmod 600 key1.pem
          chmod 600 key2.pem

      - name: Deploy to EC2 Server 1
        run: |
          ssh -i key1.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_1 }} "
            cd /var/www/html &&
            git pull origin main &&
            sudo systemctl restart httpd
          "

      - name: Deploy to EC2 Server 2
        run: |
          ssh -i key2.pem -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_2 }} "
            cd /var/www/html &&
            git pull origin main &&
            sudo systemctl restart httpd
          "